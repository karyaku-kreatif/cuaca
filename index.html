<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaca • Karyaku Kreatif</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --card: rgba(15, 23, 42, .75);
            --line: rgba(51, 65, 85, .7);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #60a5fa;
            --amber: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            background-color: var(--bg);
            background-image:
                radial-gradient(at 10% 10%, rgba(37, 99, 235, .22) 0, transparent 55%),
                radial-gradient(at 95% 5%, rgba(245, 158, 11, .12) 0, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, .1) 0, transparent 50%);
            padding: 16px;
            overflow-y: auto;
        }
        .wrap { max-width: 420px; margin: 0 auto; }

        /* Pencarian */
        .search { position: relative; display: flex; gap: 8px; }
        .search input {
            flex: 1; min-width: 0;
            background: var(--card); color: var(--text);
            border: 1px solid var(--line); border-radius: 14px;
            padding: 11px 14px; font: inherit; font-size: 14px;
        }
        .search input::placeholder { color: #64748b; }
        .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(96, 165, 250, .2); }
        .icon-btn {
            background: var(--card); color: var(--text);
            border: 1px solid var(--line); border-radius: 14px;
            width: 44px; cursor: pointer; font-size: 17px;
        }
        .icon-btn:hover { border-color: var(--accent); }
        .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .results {
            position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 5;
            background: #0f172a; border: 1px solid var(--line); border-radius: 14px;
            overflow: hidden; display: none; box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
        }
        .results.show { display: block; }
        .results button {
            display: block; width: 100%; text-align: left;
            background: none; border: 0; color: var(--text);
            padding: 10px 14px; font: inherit; font-size: 13px; cursor: pointer;
            border-bottom: 1px solid rgba(51, 65, 85, .5);
        }
        .results button:last-child { border-bottom: 0; }
        .results button:hover, .results button:focus-visible { background: rgba(37, 99, 235, .2); outline: none; }
        .results small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
        .results .empty { padding: 12px 14px; font-size: 13px; color: var(--muted); }

        /* Kartu utama */
        .now {
            margin-top: 14px; padding: 20px 18px;
            background: var(--card); border: 1px solid var(--line); border-radius: 22px;
            backdrop-filter: blur(12px);
        }
        .place { font-size: 14px; color: var(--muted); font-weight: 500; }
        .place b { color: var(--text); font-weight: 600; }
        .main { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
        .temp { font-size: 64px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
        .temp sup { font-size: 24px; font-weight: 500; letter-spacing: 0; vertical-align: top; position: relative; top: 8px; color: var(--muted); }
        .big-emoji { font-size: 64px; line-height: 1; }
        .desc { margin-top: 10px; font-size: 16px; font-weight: 600; }
        .feels { font-size: 13px; color: var(--muted); margin-top: 2px; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
        .stat { background: rgba(2, 6, 23, .5); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
        .stat span { display: block; font-size: 11px; color: var(--muted); }
        .stat b { display: block; font-size: 15px; margin-top: 3px; font-weight: 600; }

        /* Prakiraan */
        .forecast { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 6px 16px; }
        .day { display: grid; grid-template-columns: 1fr 34px auto; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(51, 65, 85, .5); font-size: 14px; }
        .day:last-child { border-bottom: 0; }
        .day .name { font-weight: 500; }
        .day .rain { display: block; font-size: 11px; color: var(--accent); margin-top: 1px; }
        .day .em { font-size: 22px; text-align: center; }
        .day .range { font-variant-numeric: tabular-nums; }
        .day .range i { font-style: normal; color: var(--muted); margin-left: 8px; }

        .foot { margin-top: 12px; text-align: center; font-size: 11px; color: #64748b; }
        .foot a { color: var(--muted); }

        /* Status */
        .state { margin-top: 14px; text-align: center; padding: 36px 16px; color: var(--muted); font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; }
        .state button { margin-top: 12px; background: #2563eb; color: #fff; border: 0; border-radius: 12px; padding: 9px 18px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
        .spin { display: inline-block; width: 26px; height: 26px; border: 3px solid rgba(96, 165, 250, .25); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div class="wrap">

    <!-- Pencarian kota -->
    <div class="search">
        <input id="q" type="search" placeholder="Cari kota..." autocomplete="off" aria-label="Cari kota">
        <button id="gps" class="icon-btn" type="button" title="Pakai lokasi saya" aria-label="Pakai lokasi saya">📍</button>
        <div id="results" class="results" role="listbox"></div>
    </div>

    <!-- Status memuat / error -->
    <div id="state" class="state"><div class="spin"></div><p>Memuat cuaca...</p></div>

    <!-- Konten cuaca -->
    <div id="content" hidden>
        <section class="now" aria-live="polite">
            <div class="place">📍 <b id="city">-</b> <span id="region"></span></div>
            <div class="main">
                <div class="temp"><span id="temp">--</span><sup>°C</sup></div>
                <div class="big-emoji" id="emoji" aria-hidden="true">🌤️</div>
            </div>
            <div class="desc" id="desc">-</div>
            <div class="feels" id="feels"></div>
            <div class="stats">
                <div class="stat"><span>Kelembapan</span><b id="hum">-</b></div>
                <div class="stat"><span>Angin</span><b id="wind">-</b></div>
                <div class="stat"><span>Peluang hujan</span><b id="rain">-</b></div>
            </div>
        </section>

        <section class="forecast" id="forecast" aria-label="Prakiraan 5 hari"></section>

        <p class="foot">Diperbarui <span id="updated">-</span> · Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
    </div>
</div>

<script>
(function () {
    'use strict';

    // Lokasi bawaan (dipakai jika belum ada pilihan tersimpan)
    var DEFAULT_LOC = { name: 'Tarakan', region: 'Kalimantan Utara', lat: 3.3, lon: 117.633 };
    var STORE_KEY = 'cuaca-lokasi';
    var REFRESH_MS = 15 * 60 * 1000;

    var $ = function (id) { return document.getElementById(id); };
    var current = loadSaved() || DEFAULT_LOC;
    var timer = null;

    /* ---------- Kode cuaca WMO -> teks Indonesia + emoji ---------- */
    function info(code, isDay) {
        var day = isDay !== 0;
        if (code === 0) return ['Cerah', day ? '☀️' : '🌙'];
        if (code === 1) return ['Cerah berawan', day ? '🌤️' : '🌙'];
        if (code === 2) return ['Berawan sebagian', day ? '⛅' : '☁️'];
        if (code === 3) return ['Mendung', '☁️'];
        if (code === 45 || code === 48) return ['Berkabut', '🌫️'];
        if (code >= 51 && code <= 55) return ['Gerimis', '🌦️'];
        if (code === 56 || code === 57) return ['Gerimis dingin', '🌧️'];
        if (code === 61) return ['Hujan ringan', '🌧️'];
        if (code === 63) return ['Hujan sedang', '🌧️'];
        if (code === 65) return ['Hujan lebat', '🌧️'];
        if (code === 66 || code === 67) return ['Hujan es', '🌧️'];
        if (code >= 71 && code <= 77) return ['Salju', '❄️'];
        if (code === 80) return ['Hujan lokal ringan', '🌦️'];
        if (code === 81) return ['Hujan lokal', '🌧️'];
        if (code === 82) return ['Hujan lokal deras', '⛈️'];
        if (code === 85 || code === 86) return ['Hujan salju', '❄️'];
        if (code === 95) return ['Badai petir', '⛈️'];
        if (code === 96 || code === 99) return ['Badai petir & es', '⛈️'];
        return ['Tidak diketahui', '🌡️'];
    }

    /* ---------- Penyimpanan lokasi ---------- */
    function loadSaved() {
        try {
            var v = JSON.parse(localStorage.getItem(STORE_KEY));
            if (v && typeof v.lat === 'number' && typeof v.lon === 'number' && v.name) return v;
        } catch (e) {}
        return null;
    }
    function save(loc) {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(loc)); } catch (e) {}
    }

    /* ---------- Tampilan status ---------- */
    function showLoading() {
        $('content').hidden = true;
        $('state').hidden = false;
        $('state').innerHTML = '<div class="spin"></div><p>Memuat cuaca...</p>';
    }
    function showError(msg) {
        $('content').hidden = true;
        $('state').hidden = false;
        $('state').innerHTML = '<p></p><button type="button" id="retry">Coba lagi</button>';
        $('state').firstChild.textContent = msg;
        $('retry').addEventListener('click', function () { load(current); });
    }

    /* ---------- Ambil & tampilkan cuaca ---------- */
    function load(loc) {
        current = loc;
        showLoading();
        clearTimeout(timer);

        var url = 'https://api.open-meteo.com/v1/forecast'
            + '?latitude=' + loc.lat + '&longitude=' + loc.lon
            + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day'
            + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
            + '&timezone=auto&forecast_days=5&wind_speed_unit=kmh';

        fetch(url)
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function (d) { render(loc, d); })
            .catch(function (err) {
                console.error('Cuaca gagal dimuat:', err);
                showError('Gagal memuat cuaca. Periksa koneksi internet lalu coba lagi.');
            });

        timer = setTimeout(function () { load(current); }, REFRESH_MS);
    }

    function dayName(dateStr, i) {
        if (i === 0) return 'Hari ini';
        if (i === 1) return 'Besok';
        return new Date(dateStr + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long' });
    }

    function render(loc, d) {
        var c = d.current, dl = d.daily;
        var w = info(c.weather_code, c.is_day);
        var temp = Math.round(c.temperature_2m);

        $('city').textContent = loc.name;
        $('region').textContent = loc.region ? '· ' + loc.region : '';
        $('temp').textContent = temp;
        $('emoji').textContent = w[1];
        $('desc').textContent = w[0];
        $('feels').textContent = 'Terasa seperti ' + Math.round(c.apparent_temperature) + '°C';
        $('hum').textContent = Math.round(c.relative_humidity_2m) + '%';
        $('wind').textContent = Math.round(c.wind_speed_10m) + ' km/j';
        var todayRain = dl.precipitation_probability_max && dl.precipitation_probability_max[0];
        $('rain').textContent = (todayRain == null ? '-' : todayRain + '%');

        var box = $('forecast');
        box.innerHTML = '';
        dl.time.forEach(function (t, i) {
            var dw = info(dl.weather_code[i], 1);
            var p = dl.precipitation_probability_max ? dl.precipitation_probability_max[i] : null;

            var row = document.createElement('div'); row.className = 'day';

            var left = document.createElement('div');
            var name = document.createElement('span'); name.className = 'name'; name.textContent = dayName(t, i);
            var rain = document.createElement('span'); rain.className = 'rain';
            rain.textContent = dw[0] + (p != null ? ' · ' + p + '%' : '');
            left.appendChild(name); left.appendChild(rain);

            var em = document.createElement('div'); em.className = 'em'; em.textContent = dw[1];

            var range = document.createElement('div'); range.className = 'range';
            range.textContent = Math.round(dl.temperature_2m_max[i]) + '°';
            var lo = document.createElement('i'); lo.textContent = Math.round(dl.temperature_2m_min[i]) + '°';
            range.appendChild(lo);

            row.appendChild(left); row.appendChild(em); row.appendChild(range);
            box.appendChild(row);
        });

        $('updated').textContent = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        $('state').hidden = true;
        $('content').hidden = false;

        // Kirim ringkasan ke halaman induk (dipakai untuk label tombol widget)
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'cuaca', temp: temp, emoji: w[1], city: loc.name }, '*');
        }
    }

    /* ---------- Cari kota ---------- */
    var results = $('results'), input = $('q'), debounce = null, reqId = 0;

    function hideResults() { results.classList.remove('show'); results.innerHTML = ''; }

    function choose(loc) {
        save(loc);
        hideResults();
        input.value = '';
        load(loc);
    }

    function search(q) {
        var my = ++reqId;
        var url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q)
            + '&count=5&language=id&format=json';
        fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (my !== reqId) return; // abaikan respons lama
                results.innerHTML = '';
                var list = d.results || [];
                if (!list.length) {
                    var e = document.createElement('div'); e.className = 'empty';
                    e.textContent = 'Kota tidak ditemukan. Coba nama lain.';
                    results.appendChild(e);
                } else {
                    list.forEach(function (r) {
                        var b = document.createElement('button'); b.type = 'button';
                        b.textContent = r.name;
                        var s = document.createElement('small');
                        s.textContent = [r.admin1, r.country].filter(Boolean).join(', ');
                        b.appendChild(s);
                        b.addEventListener('click', function () {
                            choose({ name: r.name, region: r.admin1 || r.country || '', lat: r.latitude, lon: r.longitude });
                        });
                        results.appendChild(b);
                    });
                }
                results.classList.add('show');
            })
            .catch(function () {
                if (my !== reqId) return;
                results.innerHTML = '<div class="empty">Pencarian gagal. Coba lagi.</div>';
                results.classList.add('show');
            });
    }

    input.addEventListener('input', function () {
        clearTimeout(debounce);
        var q = input.value.trim();
        if (q.length < 2) { reqId++; hideResults(); return; }
        debounce = setTimeout(function () { search(q); }, 350);
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Escape') { hideResults(); input.blur(); } });
    document.addEventListener('click', function (e) { if (!e.target.closest('.search')) hideResults(); });

    /* ---------- Lokasi saya ---------- */
    $('gps').addEventListener('click', function () {
        if (!navigator.geolocation) { showError('Browser ini tidak mendukung lokasi.'); return; }
        showLoading();
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                choose({
                    name: 'Lokasi saya', region: '',
                    lat: Math.round(pos.coords.latitude * 1000) / 1000,
                    lon: Math.round(pos.coords.longitude * 1000) / 1000
                });
            },
            function () { showError('Izin lokasi ditolak. Cari nama kota secara manual.'); },
            { timeout: 10000, maximumAge: 600000 }
        );
    });

    load(current);
})();
</script>
</body>
</html>
